  opponent_kwargs:
    seed: 71
  opponent_pool:
  # ~85% bow-advantage foes (ranged pressure + uncatchable kiter), ~15%
  # rehearsal of proven melee/shield/sustain/pearl skills to resist forgetting.
  - enabled:
    - sword
    - shield
    - bread
    - golden_apple
    - ender_pearl
    - bow
    sample_pool:
    - {opponent: bowfighter, kwargs: {}, weight: 5.0}
    - {opponent: rangedrunner, kwargs: {}, weight: 3.0}
    - {opponent: melee, kwargs: {}, weight: 1.0}
    - {opponent: shieldmixed, kwargs: {}, weight: 0.5}
    - {opponent: farfighter, kwargs: {}, weight: 0.5}

# Baseline: PPO vs scripted melee. Single source of truth; no hardcoded values in code.
run:
  name: baseline_melee
  seed: 0

env:
  arena_size: 20
  wall_margin: 1.0
  obstacles: [[8.0, 8.0, 9.0, 9.0, 2.0], [11.0, 11.0, 12.0, 12.0, 2.0]]
  max_ticks: 900
  frame_skip: 4
  opponent: melee
  opponent_kwargs: {attack_range: 2.8, strafe_ticks: 35, jump_prob: 0.02, seed: 0}

reward:
  w_damage_dealt: 0.20
  w_damage_taken: -0.12
  kill: 10.0
  death: -10.0
  win: 5.0
  loss: -5.0
  engage_bonus: 0.01
  engage_range: 6.0
  face_bonus: 0.005
  step_penalty: -0.001
  timeout_penalty: -1.0

training:
  algorithm: PPO
  timesteps: 1000000
  lr: 0.0003
  n_steps: 512
  batch_size: 256
  n_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  net_arch: [128, 128]

eval:
  freq: 50000
  episodes: 10
  seeds: [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009]

checkpoint:
  dir: checkpoints/baseline
  freq: 100000
  keep: 5

perf:
  n_envs: 2        # 2-vCPU VPS pick (bench logs/bench.json: 4/8 win on 12 CPUs
                   # but thrash 2 cores once gradient updates share them)
  headless: true

logging:
  tensorboard: logs/baseline

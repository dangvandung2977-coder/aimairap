# Phase 2.75: grounded viability via environment. Obs v3 (sufficient — see note).
# Reward UNCHANGED. Train foe seeds < 1000; eval suite seeds >= 5000.
#
# Obs review verdict (no v4): v3 already exposes own/foe on_ground, vertical
# velocity inside relative velocity, 4-tick foe displacement, own/foe ticks
# since last attempt + last-attempt outcome, both cooldowns, both hurt states.
# Everything needed for grounded-vs-airborne decisions is present.
run:
  name: phase275_grounded
  seed: 31

env:
  arena_size: 20
  wall_margin: 1.0
  obstacles: [[8.0, 8.0, 9.0, 9.0, 2.0], [11.0, 11.0, 12.0, 12.0, 2.0]]
  max_ticks: 900
  frame_skip: 4
  obs_version: 3
  opponent: melee
  opponent_kwargs: {seed: 31}
  opponent_pool:
    - until: 250000
      pool:
        - {opponent: melee, kwargs: {seed: 31}}
        - {opponent: chaser, kwargs: {seed: 32}}
    - until: 500000
      pool:
        - {opponent: gspace, kwargs: {seed: 33}}
        - {opponent: melee, kwargs: {seed: 34}}
    - until: 750000
      pool:
        - {opponent: gantiair, kwargs: {seed: 35}}
        - {opponent: strafepress, kwargs: {seed: 36}}
    - until: 1000000
      pool:
        - {opponent: greengage, kwargs: {seed: 37}}
        - {opponent: backoff, kwargs: {seed: 38}}
    - until: 1250000
      pool:
        - {opponent: gmixed, kwargs: {seed: 39}}
        - {opponent: misspunish, kwargs: {seed: 40}}
    - until: null
      pool:
        - {opponent: gmixed, kwargs: {seed: 41}}
        - {opponent: gantiair, kwargs: {seed: 42}}
        - {opponent: random, kwargs: {seed: 43}}
        - {opponent: mixed, kwargs: {seed: 44}}

reward:
  w_damage_dealt: 0.20
  w_damage_taken: -0.12
  kill: 10.0
  death: -10.0
  win: 5.0
  loss: -5.0
  engage_bonus: 0.01
  engage_range: 6.0
  face_bonus: 0.005
  step_penalty: -0.001
  timeout_penalty: -1.0

training:
  algorithm: PPO
  timesteps: 1500000
  lr: 0.0003
  n_steps: 512
  batch_size: 256
  n_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  net_arch: [128, 128]

eval:
  freq: 100000
  episodes: 10
  seeds: [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009]

checkpoint:
  dir: checkpoints/phase275
  freq: 250000
  keep: 5

perf:
  n_envs: 2
  headless: true

logging:
  tensorboard: logs/phase275
